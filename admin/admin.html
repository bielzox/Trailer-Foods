:root{--gl-hl:inset 0 1px 0 #ffffff59,inset 0 -1px 0 #ffffff10,inset 0 0 14px #ffffff0d;--gl-sheen:linear-gradient(180deg,#ffffff38,#ffffff00 58%);--gl-bd:1px solid #ffffff33;--gl-blur:blur(14px) saturate(180%)}
header{background:linear-gradient(180deg,#ffffff14,#ffffff04),#0b0b0f8c;-webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);border-bottom:1px solid #ffffff2b;box-shadow:inset 0 1px 0 #ffffff1f,0 8px 30px #0005}
.btn,.tab,.chipk{-webkit-backdrop-filter:var(--gl-blur);backdrop-filter:var(--gl-blur);border:var(--gl-bd);box-shadow:var(--gl-hl);transition:transform .15s,box-shadow .2s,background .2s}
.btn{background:var(--gl-sheen),color-mix(in srgb,var(--ac) 72%,transparent)}
.btn.g{background:var(--gl-sheen),#ffffff1a}
.btn.r{background:var(--gl-sheen),#ff5d6c2e;border-color:#ff5d6c55}
.tab{background:none;border-color:transparent;box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none}
.tab:hover{background:var(--gl-sheen),#ffffff14;border:var(--gl-bd)}
.tab.on{background:var(--gl-sheen),#ffffffd9;color:#000;border-color:#fff;box-shadow:var(--gl-hl),0 4px 14px #0004}
.chipk{background:var(--gl-sheen),#ffffff14}
.chipk.on{background:var(--gl-sheen),#ffffffd9;color:#000;border-color:#fff}
.btn:hover,.chipk:hover{box-shadow:var(--gl-hl),0 6px 20px #0004}
.btn:active,.chipk:active,.tab:active{transform:scale(.96)}
.btn:disabled{opacity:.5;cursor:default}
